<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmações | Clicar</title><style>body{font-family:system-ui,sans-serif;max-width:1050px;margin:35px auto;padding:0 18px;color:#1b231e}h1{letter-spacing:-.04em}input,button{padding:12px;border-radius:9px;border:1px solid #d3ddd5;font:inherit}button{background:#159943;color:white;border:0;cursor:pointer}table{border-collapse:collapse;width:100%;margin-top:20px}td,th{padding:12px;border-bottom:1px solid #e5ebe6;text-align:left}main{overflow-x:auto}#message{color:#a12a2a}</style><h1>CLICAR <span style="color:#159943">VEÍCULOS</span></h1><h2>Confirmações de presença</h2><p>Acesso restrito à equipe. Informe a senha administrativa configurada no servidor.</p><input id="password" type="password" placeholder="Senha administrativa" autocomplete="off"><button id="load">Consultar</button><button id="export" disabled>Exportar CSV</button><p id="message"></p><p id="summary"></p><main><table><thead><tr><th>Nome</th><th>WhatsApp</th><th>Cidade</th><th>Acompanhantes</th><th>Data da confirmação</th></tr></thead><tbody id="rows"></tbody></table></main><script>
let data=[];const msg=document.getElementById('message');document.getElementById('load').onclick=async()=>{msg.textContent='Consultando...';try{const r=await fetch('/api/admin/confirmations',{headers:{Authorization:'Bearer '+document.getElementById('password').value}});if(!r.ok)throw Error('Acesso negado ou erro ao consultar.');data=await r.json();const body=document.getElementById('rows');body.replaceChildren();for(const x of data){const tr=document.createElement('tr');for(const v of [x.name,x.phone,x.city,x.guests,new Date(x.created_at).toLocaleString('pt-BR')]){const td=document.createElement('td');td.textContent=v;tr.append(td)}body.append(tr)}document.getElementById('summary').textContent=data.length+' confirmações • '+data.reduce((n,x)=>n+1+x.guests,0)+' pessoas no total';document.getElementById('export').disabled=false;msg.textContent=''}catch(e){msg.textContent=e.message}};document.getElementById('export').onclick=()=>{const csv=[['Nome','WhatsApp','Cidade','Acompanhantes','Data'],...data.map(x=>[x.name,x.phone,x.city,x.guests,x.created_at])].map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='confirmacoes-clicar.csv';a.click();URL.revokeObjectURL(a.href)};
</script></html>
